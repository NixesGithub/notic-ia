name: Noticias IA diarias

# El digest sale todos los días a las 9:00 hora de Madrid, en los runners de
# GitHub: no depende de que ningún ordenador esté encendido.
# Cuatro secciones: noticias de IA del día anterior, repos de GitHub que están
# ganando estrellas rápido, un resumen de lo que de todo eso te cambia algo de
# verdad, y el cruce con los proyectos de laboratorio/ (que sólo escribe cuando
# encuentra algo, así que lo normal es que no aparezca).
#
# El cron de GitHub Actions sólo entiende UTC y Madrid cambia de offset con el
# horario de verano, así que el script decide en tiempo de ejecución si la hora
# local cae en la ventana del digest (de DIGEST_HOUR a DIGEST_HOUR+MARGEN_HORAS).
#
# GitHub NO entrega el `schedule` cerca de la hora pedida. En la primera semana
# real (29/08-02/09) llegó un único evento al día, entre 3 y 12 horas tarde, y
# el 27/08 no llegó ninguno. Disparar a varias horas UTC (07,08,09,10) no evita
# esto: GitHub igual sólo entrega uno, tarde. La defensa real es una ventana
# ancha (ver DIGEST_MARGEN_HORAS más abajo) para no rechazar el único disparo
# que llega. Reintentar/ampliar es gratis porque la marca de caché corta el
# envío doble si alguna vez llegara más de uno el mismo día.
on:
  schedule:
    - cron: '0 7,8,9,10 * * *'
  workflow_dispatch:
    inputs:
      ventana:
        description: 'Ventana de noticias'
        type: choice
        options: [ayer, ultimas24h]
        default: ultimas24h
      secciones:
        description: 'Qué enviar'
        type: choice
        options:
          - noticias,repos,resumen,laboratorio
          - noticias,repos,resumen
          - noticias,repos
          - noticias
          - repos
          - noticias,resumen
          - repos,laboratorio
        default: noticias,repos,resumen,laboratorio
      dry_run:
        description: 'Sólo listar candidatos, sin llamar a Anthropic ni enviar a Telegram'
        type: boolean
        default: false

# Dos ejecuciones a la vez podrían mandar el digest por duplicado.
concurrency:
  group: noticias-ia
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIGEST_TZ: Europe/Madrid
      DIGEST_HOUR: '9'
      # Hasta cuántas horas después de DIGEST_HOUR se acepta el digest. La
      # primera semana real (29/08-02/09) GitHub entregó el `schedule` un único
      # evento al día, entre 3 y 12 horas tarde (nunca dentro de una ventana de
      # 3 horas) — no varios disparos de los que se pierden algunos, sino uno
      # solo que llega tarde. 14 cubre hasta las 23:59 y no deja ese disparo
      # afuera; la marca de caché es lo único que evita el envío doble.
      DIGEST_MARGEN_HORAS: '14'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Fecha local
        id: fecha
        run: echo "hoy=$(TZ=$DIGEST_TZ date +%F)" >> "$GITHUB_OUTPUT"

      # Varias ejecuciones del día caen dentro de la ventana del digest. Esta
      # marca hace que sólo la primera lo envíe: es lo único que impide el
      # duplicado, así que no la quites al tocar el cron.
      - name: ¿Ya se envió hoy?
        id: marca
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v6
        with:
          path: .enviado
          key: noticias-ia-enviado-${{ steps.fecha.outputs.hoy }}

      - name: Generar y enviar el digest
        if: steps.marca.outputs.cache-hit != 'true'
        env:
          # La key va en Secrets. ANTHROPIC_API_KEY se sigue aceptando para no
          # romper nada si ya estaba puesta.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Esto NO son credenciales: son configuración, así que van en la
          # pestaña Variables, no en Secrets. Si están vacías se usa Anthropic
          # con claude-sonnet-5, que es el comportamiento de siempre.
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          DIGEST_MODEL: ${{ vars.DIGEST_MODEL }}
          DIGEST_MODEL_NOTICIAS: ${{ vars.DIGEST_MODEL_NOTICIAS }}
          DIGEST_MODEL_REPOS: ${{ vars.DIGEST_MODEL_REPOS }}
          DIGEST_MODEL_RESUMEN: ${{ vars.DIGEST_MODEL_RESUMEN }}
          DIGEST_MODEL_LABORATORIO: ${{ vars.DIGEST_MODEL_LABORATORIO }}
        run: |
          python scripts/noticias_ia.py \
            --ventana "${{ inputs.ventana || 'ayer' }}" \
            --secciones "${{ inputs.secciones || 'noticias,repos,resumen,laboratorio' }}" \
            --marca .enviado/${{ steps.fecha.outputs.hoy }} \
            ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # always() no es decorativo: un `if` sin función de estado lleva un
      # success() implícito, así que sin esto una sección que falla deja el
      # digest sin marcar y el siguiente disparo de la ventana reenvía lo que
      # sí había salido. El script sólo crea el archivo si envió algo.
      - name: Anotar que ya salió
        if: always() && github.event_name == 'schedule' && hashFiles('.enviado/**') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .enviado
          key: noticias-ia-enviado-${{ steps.fecha.outputs.hoy }}
